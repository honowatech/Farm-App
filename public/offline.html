<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors-ligne — Farm-App</title>
    <style>
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background: #f5f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333333;
        }
        .card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
            padding: 32px;
            text-align: center;
            max-width: 360px;
            width: 90%;
        }
        .icon {
            font-size: 48px;
            color: #ea5455;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 8px;
        }
        p {
            font-size: 14px;
            color: #666666;
            margin: 0 0 24px;
        }
        button {
            background: #7367f0;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Vous êtes hors-ligne</h1>
        <p>Vérifiez votre connexion internet, puis réessayez.</p>
        <button onclick="window.location.reload()">Réessayer</button>
    </div>
</body>
</html>
